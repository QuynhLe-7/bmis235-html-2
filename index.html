<!-- ===================== DARK MODE SCRIPT ===================== -->
<script>
  // 1. Your two colors. Change these to your own.
  var lightColor = "#f2f2f2";
  var darkColor  = "#222222";

  // 2. Which mode the page is in right now
  var dark = false;

  // 3. Paint the page one color and the embed block the other
  function paint() {
    var pageColor  = dark ? darkColor  : lightColor;
    var blockColor = dark ? lightColor : darkColor;
    document.body.style.backgroundColor = pageColor;
    document.body.style.color = dark ? "white" : "black";
    var block = document.getElementById("embed-block");
    block.style.backgroundColor = blockColor;
    block.style.color = dark ? "black" : "white";
  }

  // 4. When the button is clicked: flip the mode, then repaint
  function toggleDark() {
    dark = !dark;
    paint();
  }

  // 5. Paint once when the page first loads
  paint();
</script>
